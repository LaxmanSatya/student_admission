name: E5 WebSite

on:
  push:
    branches:
        -main

permissions:
      contents: read
      pages: write
      id-tokens: write

jobs:
  deploy:
    runs-on: ubuntu

  environment:
    name: github-pages
    url: ${{steps.seployment.outputs.page_url}}

  steps:
    -name: Checkout code
     uses: actions/checkout@v4

    -name: Setup Pages
     uses: actions/configure-pages@v5

    -name: Upload website
     uses: actions/upload-pages-artfact@v3
     with:
        path: .

    -name: Deploy to GitHub Pages
     id: deployment
     uses: actions/deploy-pages@v4
     